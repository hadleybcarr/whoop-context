<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Context</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="w-mark" viewBox="5.5 9 19 13.6">
      <path d="M6 9.5L8.55057 17.3372H10.1478L7.59855 9.5H6Z"/>
      <path d="M22.4015 9.50004L19.1006 19.6442L17.3481 14.2602H15.7509L18.3015 22.1H19.9L24 9.50004H22.4015Z"/>
      <path d="M10.1 22.1L14.2014 9.50004H15.7986L11.6986 22.1H10.1Z"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 4.5L7.5 12l7.5 7.5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M14.5 5.5l4 4M4.5 19.5l1-4.5L15.8 4.7a1.4 1.4 0 0 1 2 0l1.5 1.5a1.4 1.4 0 0 1 0 2L9 18.5z"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M2.5 12h4l2-5 4 10 2.5-7 1.5 2h5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/></symbol>
    <symbol id="i-peak" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/><path d="M12.8 9.5l-2.3 3.2h3l-2.3 3.3"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3.5 17l6-6 4 4 7-7.5M15 7.5h5.5V13"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-day" viewBox="0 0 24 24"><path d="M4 16a8 8 0 0 1 16 0"/><path d="M12 8v3"/></symbol>
  </svg>

  <main class="app">
    <header class="app-header">
      <div class="nav-row">
        <button class="icon-btn" id="back-home" aria-label="Back to WHOOP home"><svg><use href="#i-back"/></svg></button>
        <h1>CONTEXT</h1>
        <button class="icon-btn" id="open-settings" aria-label="Data sources"><svg><use href="#i-gear"/></svg></button>
      </div>
      <div class="date-nav">
        <button id="prev-day" aria-label="Previous day"><svg><use href="#i-left"/></svg></button>
        <button id="date-label" aria-label="Pick a date" aria-haspopup="dialog">TODAY</button>
        <button id="next-day" aria-label="Next day"><svg><use href="#i-right"/></svg></button>
      </div>
      <!-- WHOOP's Home tabs; this page is the Context tab. The others live in the WHOOP app. -->
      <nav class="top-tabs" aria-label="WHOOP Home">
        <span>OVERVIEW</span>
        <span>SLEEP</span>
        <span>RECOVERY</span>
        <span>STRAIN</span>
        <span class="active" aria-current="page">CONTEXT</span>
      </nav>
    </header>

    <div class="scroll" id="scroll">
      <section class="view" id="view-timeline">
        <div id="gauge-slot"></div>
        <div id="whoop-day-slot"></div>
        <div id="day-chart-slot"></div>
        <div id="day-insight"></div>
        <div class="section-header">
          <span id="threads-title">TODAY'S THREADS</span>
          <div class="section-actions">
            <label class="metric-menu">
              <select id="metric-select" aria-label="Stat shown"></select>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
            </label>
            <button class="square-plus" id="plus-btn" aria-label="Add an event"><svg><use href="#i-plus"/></svg></button>
          </div>
        </div>
        <ol class="threads" id="threads"></ol>
        <p class="empty" id="timeline-empty" hidden></p>
        <div id="breakdown-slot"></div>
      </section>
    </div>

    <nav class="dock" aria-label="WHOOP">
      <div class="tabbar">
        <span class="tab-item active">
          <svg viewBox="0 0 24 24"><path d="M3.5 11L12 3.5 20.5 11V20a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5z"/><path d="M7 16l3-3 2.5 2L17 11"/></svg>
          Home
        </span>
        <span class="tab-item">
          <svg viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="17" rx="1.5"/><path d="M9 3.5h6v3H9z"/><path d="M8.5 11l1.6 5 1.9-5 1.9 5 1.6-5"/></svg>
          Plan
        </span>
        <span class="tab-item">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2"/><circle cx="12" cy="6" r="2.2"/><circle cx="18" cy="7" r="2"/><path d="M2.5 17v-2.5a3 3 0 0 1 5-2.2M21.5 17v-2.5a3 3 0 0 0-5-2.2M8 18.5v-3a4 4 0 0 1 8 0v3"/></svg>
          Community
        </span>
        <span class="tab-item">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          More
        </span>
      </div>
    </nav>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-labelledby="sheet-heading"></aside>
    <aside class="sheet" id="coach" aria-hidden="true" role="dialog" aria-labelledby="coach-title"></aside>
    <aside class="sheet info" id="info" aria-hidden="true" role="dialog" aria-labelledby="info-title"></aside>
    <aside class="popover" id="calendar" aria-hidden="true" role="dialog" aria-labelledby="calendar-title"></aside>
    <aside class="sheet settings" id="calendar-setup" aria-hidden="true" role="dialog" aria-labelledby="calendar-setup-title"></aside>
    <aside class="sheet settings" id="whoop-setup" aria-hidden="true" role="dialog" aria-labelledby="whoop-setup-title"></aside>

    <aside class="sheet settings" id="settings" aria-hidden="true" role="dialog" aria-labelledby="settings-title">
      <div class="sheet-handle"></div>
      <h2 class="sheet-title" id="settings-title">DATA SOURCES</h2>
      <p class="settings-source" id="source-label">Demo data</p>
      <div class="stat-group">
        <button class="group-row" id="connect-calendar">
          <svg class="row-icon" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span class="row-label">GOOGLE CALENDAR</span>
          <span class="row-status" id="calendar-status">CONNECT</span>
        </button>
        <label class="group-row">
          <svg class="row-icon"><use href="#i-heart"/></svg>
          <span class="row-label">IMPORT HEART RATE</span>
          <span class="row-status" id="hr-status">CSV</span>
          <input type="file" id="hr-file" accept=".csv,text/csv" hidden>
        </label>
        <button class="group-row" id="connect-whoop">
          <svg class="row-icon filled"><use href="#w-mark"/></svg>
          <span class="row-label">WHOOP</span>
          <span class="row-status" id="whoop-status">SET UP</span>
        </button>
        <button class="group-row" id="train-model" hidden>
          <svg class="row-icon"><use href="#i-trend"/></svg>
          <span class="row-label">TRAIN MY MODEL</span>
          <span class="row-status">RUN</span>
        </button>
        <button class="group-row" id="export-csv">
          <svg class="row-icon" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/></svg>
          <span class="row-label">EXPORT LABELS</span>
          <span class="row-status">CSV</span>
        </button>
      </div>
      <button class="text-btn" id="disconnect-whoop" hidden>Disconnect WHOOP</button>
    </aside>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
